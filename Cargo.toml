[package]
name = "hey_wiki"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "The Minecraft Wiki, a keypress away: press H to open the page of what you look at, in the game or the browser. A Horizon native mod."
publish = false

# The helpers reach the brain as `wiki::` — the crate's extern name, not the
# package's.
[lib]
name = "wiki"

[dependencies]
# The pinned SDK's API crate; the launcher stages its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
