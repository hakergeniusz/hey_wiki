[package]
name = "horizon-hey-wiki"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Hey Wiki: press H to open the Minecraft Wiki page of the block, mob or item you are looking at, Alt+H for the item in your hand, and B for an in-game wiki search box. A Horizon native mod."
publish = false

# The runtime doubles as the mod's library (its tests) and the module the
# bundle injects into the game; the helper files compile only inside it.
[lib]
path = "mixins/hey_wiki/runtime.rs"
